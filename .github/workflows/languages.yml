name: languages
on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GHIDRA_VERSION: "12.2"
  GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
jobs:
  architectures:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - id: list
        run: echo "list=$(uv run python -c 'import json; from sass.sleigh.build import ARCHES; print(json.dumps(ARCHES))')" >> "$GITHUB_OUTPUT"
  compile:
    needs: architectures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.architectures.outputs.list) }}
        fp: [exact, readable]
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/ghidra/ghidra_12.2_PUBLIC
      SASS_COMPILER_HEAP: 13  # one compiler on a 16 GB runner; SM100+ peaked at 11.7 GiB
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - id: ghidra
        uses: actions/cache@v5
        with:
          path: ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}
      - if: steps.ghidra.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ZIP}"
          unzip -q ghidra.zip -d ghidra && rm ghidra.zip
      - run: uv run sass-build-languages ${{ matrix.arch }} --fp ${{ matrix.fp }} --jobs 1 --output languages
      - run: mv languages/build-results.json "languages/build-results-${{ matrix.arch }}-${{ matrix.fp }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: language-${{ matrix.arch }}-${{ matrix.fp }}
          path: |
            languages/sass_sm*.sla
            languages/sass_sm*.slaspec
            languages/sass_sm*.pspec
            languages/build-results-*.json
            languages/lib/SASS.jar
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Ghidra 12.0.4 for the processor JAR
        run: |
          curl -fsSL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
          unzip -q ghidra.zip -d "$RUNNER_TEMP"
      - uses: actions/download-artifact@v8
        with:
          pattern: language-*
          merge-multiple: true
          path: languages
      - name: Build compatible processor JAR
        run: uv run python -c 'from sass.sleigh import processor; processor.build("${{ runner.temp }}/ghidra_12.0.4_PUBLIC", "languages")'
      - name: package
        run: |
          cp processor/SASS/data/languages/{sass_common.sinc,sass.pspec,sass.cspec} languages/
          # Recreate the merged language index and architecture-specific processor specs.
          uv run python -c 'from pathlib import Path; from sass.sleigh import gen; gen.OUT = Path("languages"); gen.write_ldefs()'
          jq -s 'add' languages/build-results-*.json > languages/build-results.json && rm languages/build-results-*.json
          # Ghidra recompiles a writable .sla whose .slaspec is missing or older than it or its includes.
          touch languages/*.sla
          mkdir -p extension/SASS/{data/languages,lib,examples}
          cp processor/SASS/Module.manifest extension/SASS/
          cp docs/ghidra-extension.md extension/README.md
          cp examples/assembler/write_value.sass extension/SASS/examples/
          nice uv run sass-assemble extension/SASS/examples/write_value.sass -o extension/SASS/examples/write_value.cubin
          cp languages/*.{sla,slaspec,pspec,cspec,sinc,ldefs,opinion} extension/SASS/data/languages/
          touch extension/SASS/data/languages/*.sla
          cp languages/lib/SASS.jar extension/SASS/lib/
          cat > extension/SASS/extension.properties <<EOF
          name=SASS
          description=NVIDIA SASS processor, CUDA cubin loader and kernel argument analyzer
          author=nvdisasm-re contributors
          createdOn=$(date -u +%Y-%m-%d)
          version=12.0.4
          EOF
          (cd extension && zip -qr ../sass-extension.zip README.md SASS)
          uv run python tests/ghidra_compat/check_extension.py sass-extension.zip
      - uses: actions/upload-artifact@v7
        with:
          path: sass-extension.zip
          archive: false
  compatibility:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12.0.4
            date: 20260303
            java: '21'
          - version: 12.1.4
            date: 20260921
            java: '21'
          - version: '12.2'
            date: 20261016
            java: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: sass-extension.zip
          skip-decompress: true
      - name: Install extension
        run: |
          curl -fsSL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.version }}_build/ghidra_${{ matrix.version }}_PUBLIC_${{ matrix.date }}.zip
          unzip -q ghidra.zip -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/Ghidra/Extensions"
          unzip -q sass-extension.zip -d "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/Ghidra/Extensions"
      - name: Import and analyze SM89 cubin
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          nice "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/support/analyzeHeadless" "$RUNNER_TEMP/project" smoke \
            -import "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/Ghidra/Extensions/SASS/examples/write_value.cubin" -loader SassCubinLoader \
            -scriptPath tests/ghidra_compat -postScript CompatibilitySmoke.java \
            -log "$RUNNER_TEMP/ghidra-smoke.log"
          grep -q SASS_COMPATIBILITY_SMOKE_PASSED "$RUNNER_TEMP/ghidra-smoke.log"
      - if: failure()
        run: |
          cat "$RUNNER_TEMP/ghidra-smoke.log" 2>/dev/null || true
          find ~/.config/ghidra -name application.log -exec cat {} \; 2>/dev/null || true
  attach-release:
    if: github.event_name == 'release'
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sass-extension.zip
          skip-decompress: true
      - name: Attach extension to published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" -- "$TAG" sass-extension.zip

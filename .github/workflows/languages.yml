name: languages
on:
  push:
    paths: ["src/sass/**", "processor/SASS/data/languages/**", "processor/SASS/src/**", "tests/ghidra_compat/**", "examples/assembler/write_value.sass", ".github/workflows/languages.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GHIDRA_VERSION: "12.2"
  GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
jobs:
  architectures:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - id: list
        run: echo "list=$(uv run python -c 'import json; from sass.sleigh.build import ARCHES; print(json.dumps(ARCHES))')" >> "$GITHUB_OUTPUT"
  compile:
    needs: architectures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.architectures.outputs.list) }}
        fp: [exact, readable]
    env:
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/ghidra/ghidra_12.2_PUBLIC
      SASS_COMPILER_HEAP: 13  # one compiler on a 16 GB runner; SM100+ peaked at 11.7 GiB
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - id: ghidra
        uses: actions/cache@v5
        with:
          path: ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}
      - if: steps.ghidra.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ZIP}"
          unzip -q ghidra.zip -d ghidra && rm ghidra.zip
      - run: uv run sass-build-languages ${{ matrix.arch }} --fp ${{ matrix.fp }} --jobs 1 --output languages
      - run: mv languages/build-results.json "languages/build-results-${{ matrix.arch }}-${{ matrix.fp }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: language-${{ matrix.arch }}-${{ matrix.fp }}
          path: |
            languages/sass_sm*.sla
            languages/sass_sm*.slaspec
            languages/sass_sm*.pspec
            languages/build-results-*.json
            languages/lib/SASS.jar
  release:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Ghidra 12.0.4 for the processor JAR
        run: |
          curl -fsSL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
          unzip -q ghidra.zip -d "$RUNNER_TEMP"
      - uses: actions/download-artifact@v8
        with:
          pattern: language-*
          merge-multiple: true
          path: languages
      - name: Build compatible processor JAR
        run: uv run python -c 'from sass.sleigh import processor; processor.build("${{ runner.temp }}/ghidra_12.0.4_PUBLIC", "languages")'
      - name: package
        run: |
          cp processor/SASS/data/languages/{sass_common.sinc,sass.pspec,sass.cspec} languages/
          # Recreate the merged language index and architecture-specific processor specs.
          uv run python -c 'from pathlib import Path; from sass.sleigh import gen; gen.OUT = Path("languages"); gen.write_ldefs()'
          jq -s 'add' languages/build-results-*.json > languages/build-results.json && rm languages/build-results-*.json
          # Ghidra recompiles a writable .sla whose .slaspec is missing or older than it or its includes.
          touch languages/*.sla
          tar --exclude=./lib -czf sass-languages.tar.gz -C languages .
          cp -a languages/. processor/SASS/data/languages/
          mkdir -p processor/SASS/lib
          cp languages/lib/SASS.jar processor/SASS/lib/
          tar --exclude=SASS/data/languages/lib -czf sass-processor.tar.gz -C processor SASS
      - uses: actions/upload-artifact@v7
        with:
          name: sass-processor
          path: sass-processor.tar.gz
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: languages-${{ github.sha }}
        run: |
          # main's builds are full releases, so releases/latest is always main's newest; other branches' are pre-releases.
          kind=$([ "$GITHUB_REF" = refs/heads/main ] && echo --latest || echo --prerelease)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" $kind \
            --title "SLEIGH languages for ${GITHUB_SHA::7}" \
            --notes "Complete SASS processor with automatic kernel-argument analysis: unpack sass-processor.tar.gz into Ghidra/Processors/. The languages-only archive unpacks into processor/SASS/data/languages/."
          gh release upload "$TAG" sass-languages.tar.gz sass-processor.tar.gz --clobber
  compatibility:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12.0.4
            date: 20260303
            java: '21'
          - version: 12.1.4
            date: 20260921
            java: '21'
          - version: '12.2'
            date: 20261016
            java: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: sass-processor
      - name: Install packaged processor
        run: |
          curl -fsSL -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.version }}_build/ghidra_${{ matrix.version }}_PUBLIC_${{ matrix.date }}.zip
          unzip -q ghidra.zip -d "$RUNNER_TEMP"
          tar -xzf sass-processor.tar.gz -C "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/Ghidra/Processors"
      - name: Import and analyze SM89 cubin
        run: |
          uv run sass-assemble examples/assembler/write_value.sass -o "$RUNNER_TEMP/write_value.cubin"
          mkdir -p "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/ghidra_${{ matrix.version }}_PUBLIC/support/analyzeHeadless" "$RUNNER_TEMP/project" smoke \
            -import "$RUNNER_TEMP/write_value.cubin" -loader SassCubinLoader \
            -scriptPath tests/ghidra_compat -postScript CompatibilitySmoke.java \
            -log "$RUNNER_TEMP/ghidra-smoke.log"
          grep -q SASS_COMPATIBILITY_SMOKE_PASSED "$RUNNER_TEMP/ghidra-smoke.log"
      - if: failure()
        run: |
          cat "$RUNNER_TEMP/ghidra-smoke.log" 2>/dev/null || true
          find ~/.config/ghidra -name application.log -exec cat {} \; 2>/dev/null || true

name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      REPORT_DIR: ${{ github.workspace }}/.coverage-comment
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Compare committed coverage
        run: python3 .github/scripts/coverage_comment.py report --directory "$REPORT_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-comment-report
          path: ${{ env.REPORT_DIR }}/coverage-changes.md
      - name: Update PR coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/coverage_comment.py publish --directory "$REPORT_DIR"
  architectures:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - id: list
        run: echo "list=$(uv run python -c 'import json; from sass.sleigh.build import ARCHES; print(json.dumps(ARCHES))')" >> "$GITHUB_OUTPUT"
  generate:
    needs: architectures
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.architectures.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv run sass-build-languages --generate-only --coverage ${{ matrix.arch }}
      - run: uv run python -m tests.autocases ${{ matrix.arch }} --check
      - run: uv run python -m tests.evidence ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.arch }}
          path: |
            processor/SASS/data/languages/sass_sm*_coverage.json
            processor/SASS/data/languages/sass_sm*_evidence.json
  up-to-date:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: processor/SASS/data/languages
      - run: uv run sass-coverage processor/SASS/data/languages --output processor/SASS/semantics/coverage.json
      - name: committed coverage matches the generator
        run: |
          git diff --exit-code processor/SASS/semantics/ || {
            echo "::error::Stale coverage or evidence. Run: uv run sass-refresh-coverage"
            exit 1; }
          test -z "$(git status --porcelain processor/SASS/semantics/)"
  python-tests:
    needs: architectures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.architectures.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv run pytest --arch ${{ matrix.arch }} --fp all
  ghidra-tests:
    needs: architectures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.architectures.outputs.list) }}
    env:
      GHIDRA: ghidra_12.2_PUBLIC
      GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v5
        with:
          path: ~/ghidra-zip
          key: ${{ env.GHIDRA_ZIP }}
      - name: Install Ghidra and its pyghidra venv
        run: |
          [ -f ~/ghidra-zip/$GHIDRA_ZIP ] || curl -fsSL --create-dirs -o ~/ghidra-zip/$GHIDRA_ZIP \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/$GHIDRA_ZIP
          unzip -q ~/ghidra-zip/$GHIDRA_ZIP -d "$RUNNER_TEMP"
          uv venv --python 3.10 "$RUNNER_TEMP/pyghidra"
          uv pip install --python "$RUNNER_TEMP/pyghidra/bin/python3" pyghidra==3.2.0 JPype1==1.5.2
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/$GHIDRA" >> "$GITHUB_ENV"
          echo "GHIDRA_PY=$RUNNER_TEMP/pyghidra/bin/python3" >> "$GITHUB_ENV"
      - run: uv run sass-build-languages ${{ matrix.arch }}
      - uses: actions/cache@v5
        with:
          path: .cache/ghidra
          key: ghidra-results-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ghidra-results-${{ matrix.arch }}-
      # The up-to-date job checks the committed coverage; plain builds don't write the manifests it summarizes.
      - run: uv run pytest -m ghidra --arch ${{ matrix.arch }} --fp all --deselect tests/test_coverage.py::test_coverage
      # Headless Ghidra reports why a language failed to load only in its log.
      - if: failure()
        run: grep -h -A30 -E '^[0-9-]+ [0-9:]+ ERROR' ~/.config/ghidra/$GHIDRA/application.log | head -300
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv build --wheel -o dist
      - name: the examples run against the installed wheel, outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          uv venv -p 3.13 v && uv pip install --python v "$GITHUB_WORKSPACE"/dist/*.whl
          test "$(v/bin/python -I -c 'import sass.paths; print(sass.paths.CHECKOUT)')" = False
          v/bin/sass-assemble "$GITHUB_WORKSPACE/examples/assembler/write_value.sass" -o w.cubin
          for e in "lift_cubin.py w.cubin" assemble_and_lift.py evaluate.py; do v/bin/python -I "$GITHUB_WORKSPACE"/examples/$e; done
